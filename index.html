<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      GitHub Pages serves static files and cannot set response headers, so
      the policy is declared in the document instead. It is deliberately
      tight, and the app is built to live inside it:

        default-src 'self'    — nothing loads from another origin
        connect-src 'self'    — the app makes no network calls at all
        style-src  'unsafe-inline' — Vite inlines the critical style tag,
                                     and Radix sets inline styles for
                                     positioning; unavoidable, and low
                                     risk with no script injection vector
        object-src 'none' / frame-ancestors 'none' — no plugins, no framing
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />

    <meta
      name="description"
      content="A personal backlog manager for games, books, shows, and everything else waiting to be finished."
    />
    <title>Backlogs</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Backlogs is a client-side application and needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
