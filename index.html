<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      GitHub Pages serves static files and cannot set response headers, so
      the policy is declared in the document. Only the directives a <meta>
      element can actually enforce are listed here — `frame-ancestors` and
      `X-Content-Type-Options` are ignored when delivered this way, and
      shipping them anyway would be a header that looks like protection
      and provides none. See docs/SECURITY.md for what that leaves open
      and why it is acceptable for an app with no session to hijack.

        default-src 'self'   — nothing loads from another origin
        script-src  'self'   — no inline script can be injected
        connect-src 'self'   — the app makes no network calls at all
        style-src   adds 'unsafe-inline' because Vite emits a critical
                    style tag and Radix sets inline styles for
                    positioning; low risk with no script vector
        object-src / form-action 'none' — no plugins, no form posts
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />

    <meta
      name="description"
      content="A personal backlog manager for games, books, shows, and everything else waiting to be finished."
    />
    <title>Backlogs</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Backlogs is a client-side application and needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
