# Keeps dependencies current so the CI audit gate does not slowly rot into
# a permanent red light. Every PR here is proved by the full pipeline
# before it can be merged, and the deploy is gated on the same checks.
#
# The grouping strategy is the same for both ecosystems, and relies on one
# documented behaviour: "Any outdated dependencies that do not match a
# rule are updated in individual pull requests." So a group scoped to
# `minor` and `patch` batches the safe bumps, and every major falls
# outside it and arrives on its own — where it can be read, tested, and
# reverted in isolation.
#
# Note there is deliberately NO `ignore` block. Ignoring
# `version-update:semver-major` does not "ungroup" majors, it suppresses
# them entirely — no PR is ever opened. That is the opposite of what is
# wanted here.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    # Room for the weekly grouped PR plus a few individual majors.
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # The workflow files pin action versions too, and those go stale in the
  # same way — this is what surfaced the Node 20 deprecation warnings.
  #
  # Watch the first deploy after any of these land: a pull request only
  # exercises the workflows that run *on* pull requests, so actions used
  # solely by the deploy workflow (configure-pages, upload-pages-artifact,
  # deploy-pages) are unproven until the merge hits master.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
