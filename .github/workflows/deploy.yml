name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  # Lets the demo be redeployed by hand — useful for confirming the site
  # still builds after a dependency bump, without an empty commit.
  workflow_dispatch:

# Only the built-in token is used. There is no deploy key, no API token,
# and no repository secret involved in publishing this app.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a
# half-uploaded artifact is not what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      # VITE_APP_MODE=demo comes from .env.demo. The base path has to be
      # the repository name because this is a project page served from
      # /<repo>/; the router reads the same value back out of BASE_URL.
      - name: Build
        run: pnpm build:demo
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.run_number }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILT_AT: ${{ github.event.repository.updated_at }}

      # Fails loudly rather than shipping a broken site: without 404.html
      # every deep link into the demo is a dead end.
      - name: Verify the SPA fallback was emitted
        run: test -f dist/404.html && test -f dist/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Proves the deployed URL actually answers, rather than trusting a
      # green deploy step.
      - name: Smoke-test the deployed site
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          body=$(curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors "$url")
          echo "$body" | grep -q "<title>Backlogs</title>"
          echo "Deployed site is reachable and serving the app shell."
