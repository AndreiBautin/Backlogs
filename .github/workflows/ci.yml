name: CI

on:
  push:
    branches: [master]
  pull_request:
  # A weekly run catches an advisory published against a dependency that
  # has not changed. Without it, a vulnerability only surfaces the next
  # time someone happens to push.
  schedule:
    - cron: '0 6 * * 1'
  # Lets the security job be re-run on demand after an advisory lands,
  # without waiting for the weekly run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile makes CI fail on a lockfile that drifted from
      # package.json, rather than quietly resolving something different
      # from what runs locally.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test:run

      # Builds both configurations. The demo build is what actually gets
      # deployed, so a failure that only appears under `--mode demo` has to
      # surface here rather than at deploy time.
      - name: Build (personal)
        run: pnpm build

      - name: Build (demo)
        run: pnpm build:demo

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs real history. The default shallow clone leaves it
          # with a commit range it cannot resolve, which fails the step
          # without having scanned anything — a false alarm that is worse
          # than no scan, because it trains you to ignore the job.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gated at `high` on purpose. A portfolio app blocked by a moderate
      # advisory in a transitive build-time dependency teaches nothing; a
      # high or critical one is worth stopping for.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # Catches a credential committed by accident. This app has never had
      # one, and the check is here to keep it that way. On a push this
      # scans the pushed commits; on the weekly schedule and on manual
      # dispatch it scans the entire history.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
